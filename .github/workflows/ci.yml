name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build y type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # `next build` hace el type-check completo de cada app, así que un PR que
      # rompa tipos o el build de una zona se frena antes del merge.
      - name: Build
        run: npm run build
